<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="description" content="A personalized browser homepage with all your favorite sites, news, weather, notes, and more." />
    <title>Browser Start Page</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a1a" />
  </head>
  <body style="margin: 0;">
    <div id="app" style="min-height: 100vh;"></div>

    <!-- Skeleton loader -->
    <div id="skeleton-loader" style="
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.3s ease-out;
      background: #0a0a1a;
    ">
      <!-- Navbar skeleton -->
      <div style="
        height: 64px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        padding: 0 16px;
      ">
        <div style="width: 140px; height: 32px; background: rgba(255,255,255,0.1); border-radius: 6px;"></div>
      </div>

      <!-- Clock skeleton -->
      <div style="display: flex; justify-content: center; margin-top: 60px;">
        <div style="width: 240px; height: 72px; background: rgba(255,255,255,0.08); border-radius: 12px;"></div>
      </div>

      <!-- Search bar skeleton -->
      <div style="display: flex; justify-content: center; margin-top: 24px;">
        <div style="width: 60%; max-width: 640px; height: 52px; background: rgba(255,255,255,0.1); border-radius: 26px;"></div>
      </div>

      <!-- Widget grid skeleton -->
      <div style="
        display: flex;
        justify-content: center;
        margin-top: 40px;
        gap: 16px;
        flex-wrap: wrap;
        padding: 0 20%;
      " id="widget-skeleton-grid"></div>
    </div>

    <script>
      (function() {
        try {
          var settings = localStorage.getItem('BHE_SETTINGS');
          var widgets = localStorage.getItem('BHE_WIDGETS');
          var isCacheHit = widgets && settings;

          // Apply background
          if (settings) {
            var parsed = JSON.parse(settings);
            var bg = parsed.background;
            if (bg) {
              if (bg.type === 'color') {
                document.body.style.background = bg.value || '#0a0a1a';
              } else if (bg.type === 'image' && bg.value) {
                document.body.style.background = "url('" + bg.value + "') no-repeat center center fixed";
                document.body.style.backgroundSize = 'cover';
              }
            }
          }

          if (isCacheHit) {
            var skeleton = document.getElementById('skeleton-loader');
            if (skeleton) skeleton.style.display = 'none';
            window.__BHE_SKELETON_SKIPPED__ = true;
          } else {
            var grid = document.getElementById('widget-skeleton-grid');
            if (grid) {
              for (var i = 0; i < 8; i++) {
                var div = document.createElement('div');
                div.style.cssText = 'width: 56px; height: 52px; background: rgba(255,255,255,0.1); border-radius: 14px;';
                grid.appendChild(div);
              }
            }
          }
        } catch(e) {}
      })();
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
